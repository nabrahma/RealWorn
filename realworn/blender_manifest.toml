schema_version = "1.0.0"

id = "realworn"
version = "3.5.0"
name = "RealWorn"
tagline = "Paintable texture layers for realistic buildings and surfaces"
maintainer = "Nabaskar"
website = "https://github.com/nabrahma/RealWorn"
type = "add-on"
blender_version_min = "5.2.0"

license = [
  "SPDX:GPL-3.0-or-later",
]

tags = ["Material", "Node"]

[permissions]
files = "Reads texture sets, writes baked textures and painted masks"
network = "Checks GitHub for RealWorn updates and downloads them"

[build]
paths_exclude_pattern = [
  "__pycache__/",
  "*.blend1",
]
